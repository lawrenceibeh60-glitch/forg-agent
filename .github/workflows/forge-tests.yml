name: Forge tests

on:
  push:
    branches: [main, feat/forge-agent-runtime, feat/forge-agentic-personality-sandbox]
  pull_request:
    branches: [main, feat/forge-agentic-personality-sandbox]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: forge/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile all Python modules
        run: python -m compileall -q .
      - name: Import application and dependencies
        run: python -c "import pydantic, mcp, fastapi, app; print('imports OK; pydantic', pydantic.__version__)"
      - name: Run tests
        env:
          ALLOW_SHELL: "0"
          SANDBOX_DOCKER: "0"
          SANDBOX_ALLOW_HOST_EXECUTION: "0"
          TASK_DB_PATH: /tmp/forge-test-tasks.sqlite3
        run: python -m pytest -q
