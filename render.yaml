services:
  - type: web
    name: forg-agent
    runtime: python
    plan: free
    rootDir: forge
    buildCommand: python -m pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: XKIRO_API_KEY
        sync: false
      - key: XKIRO_BASE_URL
        value: https://api.xkiro.com/v1
      - key: XKIRO_MODEL
        value: mistralai/devstral-medium
      - key: APP_PASSWORD
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: RENDER_API_KEY
        sync: false
      # Public Render must not execute arbitrary commands on the host.
      - key: ALLOW_SHELL
        value: "0"
      - key: SANDBOX_DOCKER
        value: "0"
      - key: SANDBOX_ALLOW_HOST_EXECUTION
        value: "0"
      - key: OAUTH_ENCRYPTION_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_REDIRECT_URI
        sync: false
      - key: WORKSPACE
        value: workspace
