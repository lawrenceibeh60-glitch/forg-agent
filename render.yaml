services:
  - type: web
    name: forg-agent
    runtime: python
    plan: free
    rootDir: forge
    buildCommand: python -m pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: XKIRO_API_KEY
        sync: false
      - key: XKIRO_BASE_URL
        value: https://api.xkiro.com/v1
      - key: XKIRO_MODEL
        value: mistralai/devstral-medium
      - key: APP_PASSWORD
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_WORKSPACE_ID
        value: tea-d7udhnosfn5c73b2jva0
      # Public Render must not execute arbitrary commands on the host.
      - key: ALLOW_SHELL
        value: "1"
      - key: SANDBOX_DOCKER
        value: "0"
      # Run commands in ephemeral managed sandboxes, not on this web service.
      - key: SANDBOX_RENDER
        value: "1"
      - key: SANDBOX_NETWORK
        value: "0"
      - key: SANDBOX_NETWORK_POLICY
        value: deny
      - key: SANDBOX_COMMAND_TIMEOUT
        value: "120"
      - key: SANDBOX_ALLOW_HOST_EXECUTION
        value: "0"
      - key: OAUTH_ENCRYPTION_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_REDIRECT_URI
        sync: false
      - key: WORKSPACE
        value: workspace
      # For durable task/session history across deploys, mount a Render disk and
      # point these paths at its mount directory. Free services have ephemeral disk.
      - key: TASK_DB_PATH
        value: data/tasks.sqlite3
      - key: FORGE_SESSION_DIR
        value: data/sessions
      # Optional fallback model. Leave unset unless a second provider is configured.
      - key: FORGE_FALLBACK_API_KEY
        sync: false
      - key: FORGE_FALLBACK_BASE_URL
        sync: false
      - key: FORGE_FALLBACK_MODEL
        sync: false
      - key: FORGE_FALLBACK_KIND
        value: openai
